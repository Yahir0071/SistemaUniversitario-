<header class="fc-navbar d-flex align-items-center py-2">
  <div class="container d-flex flex-wrap align-items-center justify-content-between gap-2">
    <a class="d-flex align-items-center gap-2 text-decoration-none" routerLink="/platos">
      <span class="fc-squircle" aria-hidden="true">🍴</span>
      <span class="fs-5 fw-bold" style="color: var(--ink)">
        Food<span class="text-brand">Campus</span>
      </span>
      <span
        class="badge rounded-pill px-2 py-1 fw-semibold"
        style="background-color: var(--brand-soft); color: var(--brand-ink); font-size: 0.7rem;"
      >
        ADMIN
      </span>
    </a>

    <nav class="fc-nav-pill-group order-3 order-md-2 mx-auto mx-md-0">
      <a class="fc-nav-link" routerLink="/platos" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
        Menú de Platos
      </a>
      <a class="fc-nav-link" routerLink="/platos/nuevo" routerLinkActive="active">
        Nuevo Plato
      </a>
      <a class="fc-nav-link" routerLink="/pedidos" routerLinkActive="active">
        Pedidos
      </a>
    </nav>

    <div class="d-flex align-items-center gap-2 order-2 order-md-3">
      <div class="fc-theme-switch" role="group" aria-label="Cambiar tema">
        <button
          type="button"
          class="fc-theme-btn"
          [class.active]="!esOscuro()"
          (click)="aplicarTema(false)"
          title="Modo claro"
        >
          ☀️
        </button>
        <button
          type="button"
          class="fc-theme-btn"
          [class.active]="esOscuro()"
          (click)="aplicarTema(true)"
          title="Modo oscuro"
        >
          🌙
        </button>
      </div>
    </div>
  </div>
</header>
